<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <title>Вход · Violite</title>
    <link rel="stylesheet" href="assets/style.css" />
    <script src="assets/common.js"></script>
  </head>
  <body>
    <main class="auth">
      <div class="auth-wrap">
      <div class="brand"><span class="brand-mark">V</span><span><b>Violite</b><small>Control</small></span></div>
      <section class="auth-card">

        <!-- Шаг 1: логин и пароль -->
        <div class="step is-active" data-step="1">
          <h1>Вход</h1>
          <p class="lead">Логин и пароль владельца</p>
          <form id="loginForm" novalidate autocomplete="on">
            <div class="form-error" id="err1" role="alert"></div>
            <div class="field">
              <label for="username">Логин</label>
              <input class="input" id="username" name="username" autocomplete="username" spellcheck="false" autofocus />
            </div>
            <div class="field">
              <label for="password">Пароль</label>
              <div class="input-wrap">
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" />
                <button type="button" class="toggle-eye" id="eye" aria-label="Показать пароль">
                  <svg class="icon" aria-hidden="true"><use href="#i-eye" /></svg>
                </button>
              </div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Продолжить</button>
          </form>
        </div>

        <!-- Шаг 2: код из приложения-аутентификатора -->
        <div class="step" data-step="2">
          <h1>Код подтверждения</h1>
          <p class="lead">6 цифр из приложения-аутентификатора</p>
          <form id="mfaForm" novalidate>
            <div class="form-error" id="err2" role="alert"></div>
            <div class="otp" id="otp">
              <input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Цифра 1" />
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 2" />
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 3" />
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 4" />
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 5" />
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 6" />
            </div>
            <button class="btn btn-primary btn-block" type="submit">Войти</button>
            <button type="button" class="link" id="back">Назад</button>
          </form>
        </div>
      </section>
      </div>
    </main>

    <script src="assets/login.js"></script>
  </body>
</html>
