<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход · Relay Admin</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="auth">
    <div class="auth-grid"></div>
    <div class="auth-glow"></div>

    <section class="auth-card" id="card">
      <div class="brand">
        <div class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></div>
        <div>
          <div class="brand-name">Relay Admin</div>
          <div class="brand-sub">Панель управления relay-сервером</div>
        </div>
      </div>

      <div class="steps">
        <!-- Шаг 1: логин и пароль -->
        <!-- TODO(backend): POST /api/auth/login {username, password} → 200 {mfa_required:true, challenge} -->
        <div class="step is-active" data-step="1">
          <h1>С возвращением</h1>
          <p class="lead">Войдите, чтобы продолжить</p>
          <form id="loginForm" novalidate autocomplete="on">
            <div class="form-error" id="err1" role="alert"><svg class="icon"><use href="#i-alert"/></svg><span></span></div>
            <div class="field">
              <label for="username">Логин</label>
              <input class="input" id="username" name="username" autocomplete="username" placeholder="admin" spellcheck="false" autofocus>
            </div>
            <div class="field">
              <label for="password">Пароль</label>
              <div class="input-wrap">
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••••" style="padding-right:40px">
                <button type="button" class="toggle-eye" id="eye" aria-label="Показать пароль"><svg class="icon"><use href="#i-eye"/></svg></button>
              </div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">
              <span class="spinner"></span><span class="label">Продолжить</span>
            </button>
          </form>
        </div>

        <!-- Шаг 2: код из приложения-аутентификатора -->
        <!-- TODO(backend): POST /api/auth/mfa {challenge, code} → Set-Cookie: session (HttpOnly; Secure; SameSite=Strict) -->
        <div class="step" data-step="2">
          <h1>Двухфакторная проверка</h1>
          <p class="lead">Введите 6-значный код из приложения-аутентификатора</p>
          <form id="mfaForm" novalidate>
            <div class="form-error" id="err2" role="alert"><svg class="icon"><use href="#i-alert"/></svg><span></span></div>
            <div class="otp" id="otp">
              <input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Цифра 1">
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 2">
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 3">
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 4">
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 5">
              <input inputmode="numeric" maxlength="1" aria-label="Цифра 6">
            </div>
            <button class="btn btn-primary btn-block" type="submit">
              <span class="spinner"></span><span class="label">Войти</span>
            </button>
            <div class="auth-meta">
              <button type="button" class="link" id="back">← Назад</button>
              <span id="otpTimer" class="mono">код обновится через 30с</span>
            </div>
          </form>
        </div>
      </div>

      <div class="auth-foot">
        <svg class="icon"><use href="#i-shield"/></svg>
        <span>Защищённое соединение · вход только по 2FA</span>
      </div>
    </section>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/login.js"></script>
</body>
</html>
