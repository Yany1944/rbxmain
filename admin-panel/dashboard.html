<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <title>Violite</title>
    <link rel="stylesheet" href="assets/style.css" />
    <script src="assets/common.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Навигация">
        <div class="brand"><span class="brand-mark">V</span><span><b>Violite</b><small>Control</small></span></div>
        <nav id="navigation"></nav>
        <div class="sidebar-foot">
          <div class="conn" id="conn">Сервер на связи</div>
          <button type="button" class="nav-item" id="theme">
            <svg class="icon" aria-hidden="true"><use href="#i-sun" /></svg
            ><span id="themeLabel">Тема</span>
          </button>
          <button type="button" class="nav-item" id="logout">
            <svg class="icon" aria-hidden="true"><use href="#i-logout" /></svg
            ><span>Выйти</span>
          </button>
        </div>
      </aside>
      <button class="scrim" id="scrim" aria-label="Закрыть меню" tabindex="-1"></button>
      <div class="main">
        <header class="mobile-bar">
          <button class="icon-btn" id="menuBtn" aria-label="Меню" aria-expanded="false" aria-controls="sidebar">
            <svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
          </button>
          <div class="brand"><span class="brand-mark">V</span><b>Violite</b></div>
        </header>
        <main class="content" id="content" tabindex="-1"></main>
      </div>
    </div>

    <dialog class="modal" id="modal" aria-labelledby="modalTitle">
      <form id="modalForm" method="dialog">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <div class="modal-foot">
          <button type="button" class="btn" id="cancelModal">Отмена</button>
          <button type="submit" class="btn btn-primary" id="submitModal">Сохранить</button>
        </div>
      </form>
    </dialog>

    <dialog class="drawer" id="drawer" aria-labelledby="drawerTitle">
      <div class="drawer-inner" id="drawerBody"></div>
    </dialog>

    <script src="assets/live.js"></script>
  </body>
</html>
